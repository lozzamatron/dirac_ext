<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
  <!-- Dirac EXT activity-bar icon. Same delta as upstream's icon.svg; the single agent dot is
       replaced by three, which is what the fork adds (several simultaneous conversations) and is
       the only badge that stays legible at 16px. -->
  <text x="12" y="14" text-anchor="middle" font-size="15"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic" fill="currentColor">δ</text>

  <!-- The subtle background underline -->
  <line x1="2" y1="21" x2="22" y2="21" stroke="currentColor" stroke-opacity="0.4"
        stroke-width="1.5" stroke-linecap="round"/>

  <!-- Three agent indicator lines -->
  <line x1="6.5" y1="21" x2="6.5" y2="18.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="12" y1="21" x2="12" y2="18.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="17.5" y1="21" x2="17.5" y2="18.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>

  <!-- Three agent dots -->
  <circle cx="6.5" cy="17.6" r="0.95" fill="currentColor"/>
  <circle cx="12" cy="17.6" r="0.95" fill="currentColor"/>
  <circle cx="17.5" cy="17.6" r="0.95" fill="currentColor"/>
</svg>
